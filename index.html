<!doctype html>
<html lang="zh-CN"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>桌游计时器</title><link rel="stylesheet" href="boardgame.css"></head>
<body><header><div><span class="eyebrow">BOARDGAME TIMER</span><h1>专注每一回合。</h1></div><button id="settings">计时设置</button></header>
<main><div class="intro"><span id="status" role="status">请选择先行玩家，然后开始对局</span><span>双人对局 · 交替计时</span></div><section class="clocks" aria-label="双人计时区域"><button class="clock left" data-side="left"><span class="player">玩家 A <span class="badge">准备就绪</span></span><span class="time">20:00</span><span class="hint">等待开始</span><span class="moves">已完成 0 回合</span></button><button class="clock right" data-side="right"><span class="player">玩家 B <span class="badge">准备就绪</span></span><span class="time">20:00</span><span class="hint">等待开始</span><span class="moves">已完成 0 回合</span></button></section>
<div class="controls"><label>先行玩家 <select id="first"><option value="left">玩家 A</option><option value="right">玩家 B</option></select></label><button id="start" class="primary">开始对局</button><button id="pause" disabled>暂停</button><button id="reset">重新开始</button></div><p class="help">点击本方计时区域结束回合。总时间耗尽后，每回合 20 秒，计时结束自动切换。</p></main>
<dialog id="dialog"><form method="dialog" id="form"><div class="dialog-head"><div><span class="eyebrow">TIME CONTROL</span><h2>计时设置</h2></div><button value="cancel" aria-label="关闭">✕</button></div><p>滑动设置时长，双方使用相同计时规则。</p><div class="setting-tabs"><button id="main-tab" type="button" aria-pressed="true">基础时间</button><button id="overtime-tab" type="button" aria-pressed="false">回合时限</button></div><p id="setting-description">每位玩家可累计使用的初始时间。</p><div class="presets"><button type="button" data-min="5">5 分钟</button><button type="button" data-min="10">10 分钟</button><button type="button" data-min="20">20 分钟</button><button type="button" data-min="30">30 分钟</button></div><div class="wheel-labels"><span>小时</span><span>分钟</span><span>秒</span></div><div class="wheels" id="wheels"></div><p id="error" role="alert"></p><button id="save" type="submit" value="save" class="primary">保存设置</button></form></dialog><script type="module" src="boardgame.js"></script></body></html>
